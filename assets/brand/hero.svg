    <text x="60" y="177" font-size="100" font-weight="650">三思</text>
    <text x="64" y="250" font-size="64" font-weight="600" letter-spacing="-2">Diverdict</text>
    <text x="64" y="329" font-size="28">独立出策，交叉质询，一锤定策。</text>
  </g>
