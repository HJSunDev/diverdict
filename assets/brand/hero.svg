<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">三思 · Diverdict</title>
  <desc id="desc">策略合议 MCP：三个独立视角出策，三家交叉质询，由贾诩给出最终方略与最脆弱的一环。</desc>
  <rect width="1200" height="380" rx="12" fill="#F5F2EA"/>
