name: 缺陷报告
description: 提供可复现的行为问题
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现
      description: 命令、工具输入、预期与实际行为；请删除私人材料和凭证。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Node、项目版本和 MCP 宿主版本。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      render: text
