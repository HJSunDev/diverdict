    <circle cx="875" cy="90" r="14"/><circle cx="875" cy="190" r="14"/><circle cx="875" cy="290" r="14"/>
  </g>
  <circle id="final-verdict" cx="1070" cy="190" r="21" fill="#B3442D"/>
  <path d="m1060 190 7 7 13-15" fill="none" stroke="#F5F2EA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="stages" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="26" text-anchor="middle" fill="#596761">
    <text x="700" y="342">3 出策</text><text x="875" y="342">3 质询</text><text x="1070" y="342" fill="#B3442D">1 决断</text>
